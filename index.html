<style>
  :root{
    --bg:#191522; --ink:#efe8f0; --sub:#b9a9bf;
    --gold:#e0a96a; --line:#3d3247; --card:#241d2d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink);
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 9px),
      linear-gradient(180deg,#221b2d,#120e17);
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;
    line-height:1.9; -webkit-text-size-adjust:100%; min-height:100vh;
  }
  .wrap{max-width:680px; margin:0 auto; padding:18px 18px 170px}
  .back{
    display:inline-block; font-size:16px; color:var(--ink); text-decoration:none;
    border:1px solid var(--line); border-radius:30px; padding:8px 20px; background:rgba(0,0,0,.35);
  }
  /* 本の表紙 */

    background:repeating-linear-gradient(90deg,#d8cfbd 0 1px,#a99f8c 1px 2px); border-radius:3px 0 0 3px;
    box-shadow:-2px 4px 10px rgba(0,0,0,.5)}
  .book .cover{position:absolute; inset:0; border-radius:6px 3px 3px 6px; overflow:hidden; background:#3b3550;
    box-shadow:0 14px 30px rgba(0,0,0,.6), 0 2px 4px rgba(0,0,0,.6)}
  .book .cover img{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover}
  .book .author{position:absolute; left:8%; bottom:4%; color:#fbf1e0; font-weight:700;
    font-size:min(4.2vw,19px); letter-spacing:.2em; text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .series{text-align:center; color:var(--gold); font-weight:700; letter-spacing:.3em; margin-top:26px; font-size:17px}
  h1{text-align:center; font-size:min(7vw,32px); margin:4px 0 0; letter-spacing:.08em; font-weight:700; white-space:nowrap}
  .subtitle{text-align:center; color:var(--sub); font-size:17px; letter-spacing:.08em}
  .desc{font-size:17px; margin:18px 0 22px; line-height:2}
  .playall{
    display:block; width:100%; margin:0 0 24px; padding:16px; font-size:18px; font-family:inherit; font-weight:700;

  .list .no{font-size:14px; color:var(--gold); min-width:56px}
  .list .ttl{flex:1; font-size:17px}
  .list .mark{font-size:13px; color:var(--gold); visibility:hidden}

  article{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px 20px; margin-bottom:20px; scroll-margin-top:12px; overflow:hidden}
  article h2{font-size:20px; margin:0 0 12px; font-weight:600}
  article p{margin:0 0 1em; font-size:17px; text-indent:1em; line-height:2.2}

  article p.sep{text-align:center; text-indent:0; letter-spacing:1em; color:var(--sub)}

  .readbtn{

  <p class="desc">信州・南相木の谷にある常源寺にまつわる、鐘の音・産声・鈴の音の三つの朗読です。「はじめに」でお話を紹介し、第一話から第三話まで続けて流れます。</p>

<script>
const EPISODES = [{"id": "r00", "no": "はじめに", "title": "この朗読帖について", "img": null, "text": ["これから、「谷にひびく ― 常源寺ものがたり」をお届けします。", "信州の山あい、南相木（みなみあいき）の谷に、常源寺（じょうげんじ）というお寺があります。", "いまからおよそ四百七十年前、戦（いくさ）の絶えない時代に、この谷の殿さま、相木市兵衛さまが、亡くなった人びとの供養のために建てたお寺です。", "ここにお届けする三つのお話は、お寺の再建を記念して発刊された冊子『名刹 常源寺』をもとにつくりました。お話の中の場面や会話は、資料に残る言い伝えから思いえがいた創作です。", "第一話「鐘の音（ね）が消えるまで」。戦で息子を亡くした母と、谷の者を守るために戦をやめた殿さまが、はじめて鳴らされる鐘の音に耳をすませます。", "第二話「卯月八日の子（うづきようかのこ）」。お寺を開いた年老いた和尚さまが、夜泣きに困る若い母親に、墓の中で生まれた自分のことを語ります。", "第三話「鈴の音（すずのね）」。戦で夫を亡くした殿さまの娘・千代さまが、父から小さな鈴を受け取り、祈りの道を歩みはじめます。", "鐘の音、赤子の産声、そして鈴の音。", "遠い昔、この谷にひびいた音に、どうぞ、しばし耳をかたむけてください。"]}, {"id": "r01", "no": "第一話", "title": "鐘の音が消えるまで", "img": "p01.jpg", "text": ["第一話「鐘の音（ね）が消えるまで」が始まります。", "信州の山あい、南相木（みなみあいき）の谷に、秋の風が下りてくる季節でした。", "おふさは、川を見下ろす段丘の上に立って、新しいお寺の屋根を見上げていました。ついこのあいだまで、ただの草はらだったところです。いまは木の香りのする本堂が建ち、鐘楼には、まだ一度も鳴らされたことのない鐘が下がっています。", "「おふさ婆さま、寒くはないか」", "振り向くと、市兵衛さまが立っていました。この谷の殿さま、相木市兵衛さまです。戦（いくさ）に出れば泣く子もだまる、と噂される人ですが、おふさの前では、いつも少し照れたように笑うのでした。", "おふさの息子は、十年前の戦で帰らぬ人となりました。亡骸（なきがら）も戻らず、墓に納めたのは、息子が使っていた古い鎌一本だけです。", "「殿さま。なんで、お寺なんぞ建てなすった」", "おふさが聞くと、市兵衛さまは谷を見渡しました。", "「わしはな、婆さま。戦をやめたのだ。武田に頭を下げた。腰抜けと笑う者もおる。だが、これ以上、谷の者を死なせとうはなかった」", "風が、刈り取ったあとの田んぼを渡っていきます。", "「それでも、もう死んでしもうた者たちがおる。おまえの息子も、わしの家来も、その親も、その親の親もだ。その者たちが、迷わずに帰ってこられる場所がほしかった」", "おふさは、黙って鐘を見上げました。", "「この鐘はな」と市兵衛さまは言いました。「ひとつ打ったら、その響きがすっかり消えるまで、じっと待つのだそうだ。それから、また打つ。三度打つ」", "「なんで、待つんです」", "「急いで次を打てば、前の音を追い越してしまう。響きが山の向こうまで届いて、ちゃんと帰っていくのを、見送ってやるのだと、和尚さまが言うておった」", "その日の夕暮れ、谷じゅうの人が、段丘の上に集まりました。年寄りも、子どもも、畑から鍬（くわ）をかついだまま来た男たちもいました。", "和尚さまが撞木（しゅもく）の綱を握り、ひとつ、鐘を打ちました。", "ごうん――。", "低い音が谷の底を這（は）い、川をわたり、向かいの山にぶつかって、またゆっくりと戻ってきます。誰も口をききませんでした。音はだんだん細くなり、細くなり、やがて夕焼けのなかに溶けていきました。", "おふさは、その響きのなかに、息子の声を聞いた気がしました。「おっかあ、ただいま」と、畑から帰ってくるときの、あの少しかすれた声を。", "ふたつめの鐘が鳴りました。また、みんなで待ちました。", "みっつめの鐘が鳴りました。", "最後の響きが消えたとき、おふさの頬には涙がつたっていました。けれどそれは、十年のあいだ流してきた涙とは、どこか違う、あたたかいものでした。", "となりを見ると、市兵衛さまも目を閉じて、静かに手を合わせていました。", "＊", "それから、四百年あまりの時が流れました。", "お寺は、いくたびも風雪にさらされ、あるときは火事にも遭いました。それでも谷の人びとは、そのたびに力を合わせ、お寺を建てなおしてきました。", "いまも、川を見下ろす段丘の上には、常源寺（じょうげんじ）が立っています。", "そして鐘を鳴らすとき、人びとはやっぱり、響きがすっかり消えるのを待ってから、次を打つのです。", "遠い昔、この谷を戦から守ろうとした殿さまと、帰らぬ息子を待ちつづけた母と、名もない多くの人びとの思いを、そっと見送るように。", "ごうん――。", "今日も、谷に鐘の音が響いています。"]}, {"id": "r02", "no": "第二話", "title": "卯月八日の子", "img": "p02.jpg", "text": ["第二話「卯月八日の子（うづきようかのこ）」が始まります。", "天文十九年の春、南相木（みなみあいき）の谷に、年老いたお坊さまがやって来ました。", "背は小さく、腰も少し曲がっています。けれど目は、春の川のように澄んでいました。", "「よう来てくださった、和尚さま」", "相木市兵衛さまが、深く頭を下げました。谷に新しく開くお寺のために、関東一円に名を知られたこの和尚さまをお招きしたのです。和尚さまは、このとき七十を越えていました。", "数日たったある晩のこと。和尚さまの泊まる庵（いおり）の戸を、若い母親がたたきました。腕の中で、赤子が火のついたように泣いています。", "「和尚さま、すみません。この子が、夜になると泣きやまなくて……。わたし、もう、どうしてやったらいいのか」", "母親の目は、真っ赤でした。", "和尚さまは赤子を受け取ると、ゆっくりと揺らしながら言いました。", "「よう泣く子じゃ。元気な声じゃのう」", "それから囲炉裏（いろり）の火を見つめて、ぽつりと話しはじめました。", "「わしもな、泣いて生まれてきた子じゃった。ただし、生まれたのは墓の中じゃ」", "母親は、息をのみました。", "「わしの母は、わしをお腹に宿したまま亡くなったのだそうな。村の者たちは、泣く泣く母を葬った。ところがその晩、墓のほうから赤子の泣き声がする。父が急いで掘り起こしてみると、冷たくなった母のかたわらで、生まれたばかりの赤子が、乳を求めて泣いておった。それが、わしじゃ」", "炉の火が、ぱちりと鳴りました。", "「生まれた日は、卯月の八日。お釈迦さまのお誕生日じゃ。父は、この子は仏さまからの授かりものだと言うて、わしを大事に育て、十三の年に鎌倉のお寺へ預けた」", "「……お母さまのお顔も、知らずに」", "「知らん。けれどな」", "和尚さまは、腕の中の赤子を見下ろしました。赤子はいつのまにか泣きやんで、和尚さまの衣の端を、小さな手でにぎっています。", "「わしは思うのじゃ。母は、命が尽きたあとも、わしを産んでくれた。声も出せず、乳もやれず、それでも、この世へわしを送り出してくれた。それほどの思いに守られて、わしはこの年まで生きてきた」", "和尚さまは、赤子をそっと母親の腕に返しました。", "「おまえさまは今、どうしたらいいかわからんと泣いておる。それでよい。わからんまま、抱いておればよい。その腕のぬくもりは、この子が忘れても、この子の命が覚えておる」", "母親の目から、涙がぽろぽろとこぼれました。腕の中で、赤子がすうすうと寝息を立てはじめました。", "その年、谷にお寺が開かれました。", "和尚さまはそれからも長く生き、九十六歳で亡くなったと伝えられています。", "毎年、卯月の八日が来ると、弟子たちは「和尚さまのお誕生日でございますね」とお祝いを言いました。", "すると和尚さまは、決まって笑って、こう答えたそうです。", "「いいや。今日は、わしの母が、いちばんがんばった日じゃ」"]}, {"id": "r03", "no": "第三話", "title": "鈴の音", "img": "p03.jpg", "text": ["第三話「鈴の音（すずのね）」が始まります。", "永禄四年の秋。", "相木の谷の館に、ひとりの若い女の人が帰ってきました。市兵衛さまのひとり娘、千代さまです。", "千代さまは、望月のお城の殿さまに嫁いでいました。けれどこの秋、川中島の戦で、その夫が討ち死にしたのです。", "館の縁側で、千代さまは何日も、ただ黙って山を見ていました。泣くこともできず、食べることもできずに。", "ある夕暮れ、市兵衛さまがとなりに腰をおろしました。手には、小さな包みを持っています。", "「千代。おまえが小さいころ、これを振って遊んでおったのを覚えておるか」", "包みの中から出てきたのは、古い鈴でした。お宮の祭りで、巫女さまが舞うときに鳴らす鈴です。", "「……覚えております。お祭りの日に、わたし、巫女さまのまねをして」", "「そうじゃ。おまえは、いつまでも鈴を離さなんだ」", "市兵衛さまは笑い、それから、ふっと遠くを見ました。", "「わしはな、千代。戦場で、たくさんの者を見送ってきた。味方も、敵もじゃ。敵にも、帰りを待つ母がおり、妻がおる。そう思うと、勝ち戦の夜でも、眠れんことがあった」", "千代さまは、はじめて父の顔をまっすぐに見ました。いつも強く、大きく見えた父の横顔に、深いしわが刻まれていました。", "「だから、わしは寺を建てた。けれど、寺を建てても、まだ足りん気がしておる。死んだ者のために祈る者が、もっともっと要るのじゃ」", "父は鈴を、千代さまの手のひらにのせました。", "「おまえの悲しみは、おまえだけのものじゃ。誰にも代わってはやれん。けれど、その悲しみを知っておるおまえだからこそ、届く祈りがあるかもしれん」", "千代さまは、鈴を握りしめました。冷たかった鈴が、手のなかで少しずつ、あたたかくなっていきました。", "その冬、千代さまは巫女になりました。やがて多くの巫女たちをたばねる巫女頭（みこがしら）となり、戦で命を落とした人びとのために、舞い、祈りつづけたと伝えられています。", "シャン、シャン、と鈴が鳴るたび、千代さまは心のなかで呼びかけました。", "（あなた。どうか、迷わずに）", "そして、名も知らぬ敵方の兵にも、同じように。", "（あなたも、どうか迷わずに。帰りを待つ人のところへ）", "春になって、千代さまは一度だけ、相木の谷に帰ってきました。父の建てたお寺の前で、千代さまは鈴を鳴らし、ゆっくりと舞いました。", "谷の人びとは手を止めて、その姿を見つめました。鈴の音は川をわたり、山へのぼり、空へと溶けていきました。", "本堂の前で、市兵衛さまは目を閉じていました。その頬がかすかにぬれているのを、千代さまだけが知っていました。"]}];

/* 本文：（よみがな）をふりがなにする */
const SPECIAL=[["卯月八日の子（うづきようかのこ）","卯月八日の子","うづきようかのこ"],["鈴の音（すずのね）","鈴の音","すずのね"]];
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function ruby(s){
  s=esc(s);
  SPECIAL.forEach(([a,b,r])=>{s=s.split(a).join("<ruby>"+b+"<rt>"+r+"</rt></ruby>");});
  return s.replace(/([一-龥々]+)（([ぁ-ゖー]+)）/g,"<ruby>$1<rt>$2</rt></ruby>");
}
function toHtml(text){
  return text.map(p=>{
    if(p==="＊")return '<p class="sep">＊</p>';
    return '<p'+(/^[「（]/.test(p)?' class="q"':'')+'>'+ruby(p)+'</p>';
  }).join("");
}

const msg=document.getElementById('msg');
const urls={};
let cur=-1, cont=true;

EPISODES.forEach((ep,i)=>{
  const li=document.createElement('li');
  li.innerHTML=`<span class="no">${ep.no}</span><span class="ttl">${ep.title}</span><span class="mark">♪ 再生中</span>`;
  li.onclick=()=>{ load(i,true); };
  list.appendChild(li);

  const art=document.createElement('article');
  art.id='ep'+i;
  art.innerHTML=`<h2>${ep.no}　${ep.title}</h2><button class="readbtn">▶ この話を聞く</button>`+toHtml(ep.text);
  art.querySelector('.readbtn').onclick=()=>{ load(i,true); };
  texts.appendChild(art);
});

/* 音声のありか：リポジトリのいちばん上か audio フォルダ。なければ、この端末に入れておいたMP3 */
function idbGet(k){return new Promise(res=>{try{const r=indexedDB.open("tani-ni-hibiku",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("audio");
  r.onsuccess=()=>{try{const q=r.result.transaction("audio").objectStore("audio").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);}catch(e){res(null)}};
  r.onerror=()=>res(null);}catch(e){res(null)}});}
async function findAudio(ep){
  if(urls[ep.id]!==undefined)return urls[ep.id];
  for(const u of [ep.id+".mp3","audio/"+ep.id+".mp3",ep.id+".mp3.mp3","../audio/"+ep.id+".mp3","../"+ep.id+".mp3.mp3","../audio/"+ep.id+".mp3.mp3"]){
    try{const r=await fetch(u,{method:"HEAD",cache:"no-store"});if(r.ok)return urls[ep.id]=u;}catch(e){}
  }
  const b=await idbGet(ep.id);
  return urls[ep.id]=b?URL.createObjectURL(b):null;
}

function fmt(t){ if(!isFinite(t)) return '0:00'; const m=Math.floor(t/60), s=Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); }

function mark(){
  [...list.children].forEach((li,i)=>li.classList.toggle('now',i===cur));
  [...texts.children].forEach((a,i)=>a.classList.toggle('now',i===cur));
}

/* はじめから最後まで続けて再生する */
async function load(i, autoplay){
  if(i<0 || i>=EPISODES.length) return;
  cur=i; followP=-1; userScrollAt=0; msg.textContent='';
  const ep=EPISODES[i];
  nowttl.textContent=ep.no+'　'+ep.title;
  document.getElementById('ep'+i).scrollIntoView({behavior:'smooth', block:'start'});
  mark();
  const u=await findAudio(ep);
  if(cur!==i) return;
  if(!u){ audio.removeAttribute('src'); playBtn.textContent='▶'; msg.textContent='この話の音声はまだ入っていません（'+ep.id+'.mp3）'; return; }
  audio.src=u;
  if(autoplay){ audio.play().catch(()=>{}); }
}

document.getElementById('playall').onclick=()=>{ load(0,true); };
playBtn.onclick=()=>{
  if(cur<0){ load(0,true); return; }
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
};
document.getElementById('prev').onclick=()=>{ load(Math.max(0,cur-1),true); };
document.getElementById('next').onclick=()=>{ if(cur<EPISODES.length-1) load(cur+1,true); };
document.getElementById('cont').onclick=function(){
  cont=!cont; this.setAttribute('aria-pressed',cont);
  msg.textContent=cont?'終わったら次の話へ進みます':'一話ずつ止まります';
};

audio.addEventListener('play', ()=>{ playBtn.textContent='⏸'; });
audio.addEventListener('pause', ()=>{ playBtn.textContent='▶'; });
/* 音声の進みに合わせて、いま読んでいるあたりの文章が画面に見えるようにする（色は付けない） */
let followP=-1, userScrollAt=0;
['touchstart','wheel'].forEach(t=>window.addEventListener(t,()=>{userScrollAt=Date.now();},{passive:true}));
function follow(){
  if(cur<0 || !audio.duration || audio.paused) return;
  if(Date.now()-userScrollAt<8000) return;            /* 自分で動かしたあとは、しばらく追いかけない */
  const ps=[...document.getElementById('ep'+cur).querySelectorAll('p')];
  if(!ps.length) return;
  const lens=ps.map(e=>e.textContent.length+6), total=lens.reduce((a,b)=>a+b,0);
  let pos=audio.currentTime/audio.duration*total, k=0;
  while(k<ps.length-1 && pos>lens[k]){ pos-=lens[k]; k++; }
  if(k===followP) return;
  followP=k;
  const r=ps[k].getBoundingClientRect(), bottom=window.innerHeight-document.querySelector('.player').offsetHeight;
  if(r.top<60 || r.bottom>bottom-40){ window.scrollBy({top:r.top-window.innerHeight*0.3, behavior:'smooth'}); }
}
audio.addEventListener('timeupdate', ()=>{
  follow();
  if(audio.duration){ seek.value=audio.currentTime/audio.duration*100; }
  timeEl.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration);
});
seek.addEventListener('input', ()=>{ if(audio.duration) audio.currentTime=seek.value/100*audio.duration; });
audio.addEventListener('ended', ()=>{
  if(SLEEP[sleepIdx]===-1){ resetSleep(); playBtn.textContent='▶'; msg.textContent='おやすみなさい'; return; }
  if(cont && cur<EPISODES.length-1){ load(cur+1,true); }
  else if(cur>=EPISODES.length-1){ playBtn.textContent='▶'; nowttl.textContent='『谷にひびく』おわりまで聞きました'; }
});

/* おやすみタイマー */
const SLEEP=[0,15,20,30,-1];
let sleepIdx=0, deadline=null, fading=null;
const sleepBtn=document.getElementById('sleep');
function resetSleep(){ sleepIdx=0; deadline=null; showSleep(); }
function showSleep(){
  const m=SLEEP[sleepIdx]; sleepBtn.setAttribute('aria-pressed',m!==0);
  sleepBtn.textContent=m===0?'☾ タイマー':m===-1?'☾ この話まで':'☾ 残り'+fmt(Math.max(0,deadline-Date.now())/1000);
}
function checkSleep(){
  if(!deadline||fading) return;
  if(Date.now()>=deadline){
    if(audio.paused){ resetSleep(); return; }
    let v=1; fading=setInterval(()=>{ v-=0.05; try{audio.volume=Math.max(0,v)}catch(e){}
      if(v<=0){ clearInterval(fading); fading=null; audio.pause(); try{audio.volume=1}catch(e){} resetSleep(); msg.textContent='おやすみなさい'; } },500);
  }
}
sleepBtn.onclick=()=>{
  if(fading){ clearInterval(fading); fading=null; try{audio.volume=1}catch(e){} }
  sleepIdx=(sleepIdx+1)%SLEEP.length; const m=SLEEP[sleepIdx];
  deadline=m>0?Date.now()+m*60000:null; showSleep();
  msg.textContent=m===0?'タイマーを切りました':m===-1?'いまの話が終わったら止めます':m+'分後にゆっくり止めます';
};
setInterval(()=>{ if(deadline) showSleep(); checkSleep(); },1000);
</script>
</body>

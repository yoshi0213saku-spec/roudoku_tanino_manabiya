<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>朗読のリアル本棚</title>
<meta name="description" content="背表紙にふれると本が取り出せる、木の本棚。本文を読みながら朗読を聞ける朗読帖が並んでいます。作　中島義健">
<meta property="og:type" content="website">
<meta property="og:title" content="朗読のリアル本棚">
<meta property="og:description" content="背表紙にふれると本が取り出せる、木の本棚。本文を読みながら朗読を聞ける朗読帖が並んでいます。作　中島義健">
<meta property="og:url" content="https://yoshi0213saku-spec.github.io/roudoku_riaru_hondana/">
<meta property="og:image" content="https://yoshi0213saku-spec.github.io/roudoku_riaru_hondana/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#231d19; --wall2:#2e2621;
    --cream:#f3e9d8; --cream2:#cbbba3; --accent:#e2a65a; --accent2:#f0c27f;
    --line:rgba(243,233,216,.14);
    --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
    --k:1;
  }
  @media (max-width:420px){:root{--k:.92}}
  @media (min-width:600px){:root{--k:1.25}}
  @media (min-width:900px){:root{--k:1.45}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--wall);color:var(--cream);font-family:var(--gothic);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  body{min-height:100vh;padding-bottom:40px;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(226,166,90,.18), transparent 55%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px),
      linear-gradient(var(--wall2), var(--wall));}
  button{font-family:inherit;color:inherit;cursor:pointer}
  .hidden{display:none !important}
  .sprite{position:absolute;width:0;height:0;overflow:hidden}

  /* ===== 見出し ===== */
  .top{padding:26px 20px 0;text-align:center}
  .top p{margin:0;color:var(--cream2);font-size:14px;letter-spacing:.06em;line-height:1.8}
  .top .author{margin-top:4px;font-family:var(--mincho);color:var(--accent2);letter-spacing:.2em}

  /* ===== 木の本棚 ===== */
  .cabinet{position:relative;max-width:1000px;margin:56px auto 0;padding:0 10px;filter:drop-shadow(0 22px 26px rgba(0,0,0,.55))}
  /* 二段目の人形 */
  .doll{flex:none;height:calc(222px * var(--k));width:auto;margin-bottom:-2px;filter:drop-shadow(3px 5px 4px rgba(0,0,0,.6))}
  .crown{position:relative;border-radius:10px 10px 0 0;padding:16px 16px 14px;text-align:center;
    background:var(--gh) 0 0/600px 120px, linear-gradient(180deg,#b07842,#8a5728 60%,#6e421d);
    box-shadow:inset 0 2px 0 rgba(255,222,175,.35), inset 0 -4px 0 rgba(0,0,0,.35)}
  .crown::before{content:"";position:absolute;left:max(30%,120px);right:max(30%,120px);top:-22px;height:24px;border-radius:50% 50% 0 0/100% 100% 0 0;
    background:var(--gh) 0 0/600px 120px, linear-gradient(180deg,#b98148,#a46e3b);box-shadow:inset 0 2px 0 rgba(255,222,175,.35)}
  .plate{display:inline-flex;align-items:center;gap:.6em;padding:8px clamp(16px,5vw,34px);border-radius:8px;
    box-shadow:inset 0 3px 7px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,222,175,.25), 0 1px 0 rgba(255,222,175,.3)}
  .carved{font-family:var(--mincho);font-weight:800;color:#4c2c12;letter-spacing:.2em;
    text-shadow:0 1px 0 rgba(255,214,160,.5), 0 -1px 1px rgba(0,0,0,.55)}
  .plate h1{margin:0;font-size:clamp(24px,6.4vw,38px)}
  .plate-txt{display:flex;flex-direction:column;align-items:center;line-height:1.15}
  .plate small{font-size:clamp(11px,3vw,14px);letter-spacing:.4em;margin-bottom:3px}
  .plate .orn{font-size:clamp(16px,4vw,24px);letter-spacing:0}
  .frame{padding:0 clamp(12px,2.8vw,22px);
    background:var(--gv) 0 0/120px 600px, linear-gradient(90deg,#6a3f1b,#9a6332 18%,#8a5729 50%,#9a6332 82%,#6a3f1b)}
  .bay{position:relative;padding:22px clamp(8px,3vw,28px) 0;
    background:var(--gh) 0 0/600px 120px, linear-gradient(180deg,#2c190c,#3d2414 40%,#46291a);
    box-shadow:inset 0 16px 20px -10px rgba(0,0,0,.85), inset 12px 0 16px -12px rgba(0,0,0,.75), inset -12px 0 16px -12px rgba(0,0,0,.75)}
  .row{display:flex;align-items:flex-end;justify-content:center;gap:calc(3px * var(--k));min-height:calc(250px * var(--k))}
  .board{position:relative;height:20px;margin:0 calc(-1 * clamp(12px,2.8vw,22px));z-index:1;
    background:var(--gh) 0 0/600px 120px, linear-gradient(180deg,#d29a60 0%,#b07842 22%,#8c5a2b 70%,#6a411c 100%);
    box-shadow:0 7px 10px -4px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,228,185,.55), inset 0 -2px 0 rgba(0,0,0,.3)}
  .board.last{height:24px}
  .plinth{height:30px;border-radius:0 0 6px 6px;
    background:var(--gh) 0 0/600px 120px, linear-gradient(180deg,#7a4b22,#5e3817);
    box-shadow:inset 0 2px 0 rgba(255,222,175,.2), inset 0 -3px 0 rgba(0,0,0,.4)}
  .feet{display:flex;justify-content:space-between;padding:0 4%}
  .feet i{width:clamp(26px,7vw,44px);height:12px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#5e3817,#3e230d)}

  /* ===== 背表紙 ===== */
  .spine{position:relative;flex:none;border:0;padding:0;
    width:calc(var(--w) * 1px * var(--k));height:calc(var(--h) * 1px * var(--k));
    border-radius:3px 3px 1px 1px;
    background:
      linear-gradient(90deg,rgba(0,0,0,.45) 0%,rgba(255,255,255,.10) 14%,rgba(255,255,255,.18) 30%,rgba(255,255,255,0) 52%,rgba(0,0,0,.18) 82%,rgba(0,0,0,.5) 100%),
      repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
      var(--c);
    box-shadow:0 0 0 1px rgba(0,0,0,.45), 2px 0 3px rgba(0,0,0,.45);
    display:flex;flex-direction:column;align-items:center;
    transition:transform .38s cubic-bezier(.3,.7,.3,1), box-shadow .3s;transform-origin:50% 100%}
  .spine:hover,.spine:focus-visible{transform:translateY(-10px);outline:none;box-shadow:0 0 0 1px rgba(0,0,0,.45), 2px 6px 10px rgba(0,0,0,.6)}
  .spine:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .spine.pulling{transform:translateY(calc(-62px * var(--k))) rotate(-2deg) scale(1.04);z-index:5;box-shadow:0 0 0 1px rgba(0,0,0,.45), 4px 16px 22px rgba(0,0,0,.7)}
  .sp-band{width:100%;height:calc(5px * var(--k));margin-top:calc(8px * var(--k));
    border-top:1px solid var(--g);border-bottom:1px solid var(--g);opacity:.9}
  .sp-band.b{margin-top:auto;margin-bottom:calc(10px * var(--k));flex:none}
  .sp-band.b:has(+ .sp-vol){margin-bottom:0}
  .sp-vol{font-size:calc(11.5px * var(--k));letter-spacing:.08em}
  .sp-no,.sp-band{flex:none}
  .sp-art{flex:none;width:78%;aspect-ratio:1/.8;margin-top:calc(7px * var(--k));border:1.5px solid var(--g);border-radius:2px;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
  .sp-art svg{display:block;width:100%;height:100%}
  .sp-title{margin-top:calc(18px * var(--k));writing-mode:vertical-rl;font-family:var(--mincho);font-weight:800;
    font-size:calc(14.5px * var(--k));letter-spacing:.12em;flex:0 1 auto;min-height:0;overflow:hidden;line-height:1.1;color:var(--g);text-shadow:0 1px 1px rgba(0,0,0,.6);
    display:flex;gap:calc(4px * var(--k));align-items:flex-start;white-space:nowrap}
  .sp-title small{font-size:.66em;font-weight:700;opacity:.9;letter-spacing:.06em;padding-top:1.2em}
  .sp-no{font-family:var(--mincho);font-weight:700;font-size:calc(10.5px * var(--k));color:var(--g);opacity:.9;padding:calc(5px * var(--k)) 0 calc(7px * var(--k));letter-spacing:0;white-space:nowrap}
  .spine[data-book="tani3"] .sp-title{text-shadow:0 1px 0 rgba(255,255,255,.55)}  /* 明るい背表紙（三の巻） */
  .spine[data-book^="wari"] .sp-title small{font-size:.6em;padding-top:.8em}  /* 谷の割付状：副題が長いので少し小さく */
  .spine[data-book="manabi"] .sp-title small{font-size:.54em;padding-top:.8em}  /* 谷の学び舎：副題がさらに長いので小さく */
  /* 本立て */
  .bookend{flex:none;width:calc(14px * var(--k));height:calc(130px * var(--k));border-radius:2px 2px 0 0;
    background:linear-gradient(90deg,#3c3f44,#8c9097 45%,#4a4d52);box-shadow:1px 0 2px rgba(0,0,0,.6)}
  /* 下の段の飾り */
  .lying{display:flex;flex-direction:column;align-items:center;gap:0;margin-right:calc(10px * var(--k))}
  .lying i{display:block;height:calc(17px * var(--k));border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.45);
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(0,0,0,.25)),var(--c)}
  .decor-svg{flex:none;height:calc(150px * var(--k));width:auto;filter:drop-shadow(2px 4px 4px rgba(0,0,0,.5))}
  .soon{align-self:center;font-family:var(--mincho);font-size:calc(13px * var(--k));color:var(--cream2);line-height:1.8;text-align:center;opacity:.85;padding:0 6px;letter-spacing:.08em;white-space:nowrap}
  @media (max-width:520px){.soon{display:none}.row .doll{margin:0 calc(14px * var(--k))}}

  /* ===== 一覧（文字で） ===== */
  .toc{max-width:560px;margin:30px auto 0;padding:0 16px}
  .toc h3{font-size:12px;letter-spacing:.2em;color:var(--accent2);font-weight:700;margin:0 0 6px 4px}
  .toc ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .toc button{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 6px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-family:var(--mincho);font-size:17px;font-weight:700}
  .toc .k{flex:none;min-width:3.6em;color:var(--accent);font-family:var(--gothic);font-size:13px}
  .toc .dot{flex:none;width:10px;height:26px;border-radius:2px;background:var(--c)}
  .toc .arrow{margin-left:auto;color:var(--accent);font-size:20px}
  footer{margin-top:28px;text-align:center;font-size:13px;color:var(--cream2);font-family:var(--mincho);letter-spacing:.1em}

  /* ===== 取り出した本 ===== */
  .bv{position:fixed;inset:0;z-index:20;background:#1b1613;overflow:hidden;animation:fadein .3s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .bv-bg{position:absolute;inset:0;opacity:.55}
  .bv-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,22,19,.55),#1b1613 70%)}
  .bv-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 60px}
  .bv-inner{position:relative;max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 18px 0}
  .bv-head{display:flex;justify-content:space-between;align-items:center;padding:4px 0 8px}
  .btn-ghost{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:22px;padding:9px 16px;font-size:15px}
  .btn-ghost:hover{background:rgba(255,255,255,.1)}
  .stage{perspective:1400px;display:flex;justify-content:center;padding:14px 0 6px}
  .tome{position:relative;width:min(64vw,280px);aspect-ratio:148/210;transform-style:preserve-3d;
    animation:takeout .7s cubic-bezier(.25,.8,.3,1) both}
  @keyframes takeout{from{transform:translateY(40px) rotateY(-62deg) scale(.55);opacity:0}to{transform:none;opacity:1}}
  /* 紙の小口（ページの重なり） */
  .tome::before{content:"";position:absolute;top:1.6%;bottom:1.6%;right:-9px;width:10px;border-radius:0 3px 3px 0;
    background:repeating-linear-gradient(90deg,#efe5cf 0 1px,#d6c9ad 1px 2px);box-shadow:2px 2px 6px rgba(0,0,0,.5)}
  .tome.tall{aspect-ratio:148/210;width:min(64vw,280px)}  /* 表紙はA5（148×210）の比率 */
  /* 右綴じの本（全冊）：背表紙は右、紙の小口（ページの厚み）は左 */
  .tome.rb{animation-name:takeoutR}
  @keyframes takeoutR{from{transform:translateY(40px) rotateY(62deg) scale(.55);opacity:0}to{transform:none;opacity:1}}
  .tome.rb::before{right:auto;left:-9px;border-radius:3px 0 0 3px;box-shadow:-2px 2px 6px rgba(0,0,0,.5)}
  .tome.rb .cover{border-radius:5px 2px 2px 5px;box-shadow:0 0 0 1px rgba(0,0,0,.5), -6px 18px 30px rgba(0,0,0,.6)}
  .tome.rb .cover::before{left:auto;right:0;width:6.5%;
    background:linear-gradient(270deg,rgba(0,0,0,.5),rgba(255,255,255,.18) 55%,rgba(0,0,0,.3))}
  .tome.rb .cover::after{background:linear-gradient(245deg,rgba(255,255,255,.18),rgba(255,255,255,0) 30%)}
  .tome.rb .cv-author{left:8%}
  .tome.rb .cv-title{right:11%}
  .cover{position:absolute;inset:0;border-radius:2px 5px 5px 2px;overflow:hidden;background:var(--c);
    box-shadow:0 0 0 1px rgba(0,0,0,.5), 6px 18px 30px rgba(0,0,0,.6)}
  .cover svg{display:block;width:100%;height:100%}
  .cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;z-index:1;
    background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.18) 55%,rgba(0,0,0,.3))}
  .cover::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.18),rgba(255,255,255,0) 30%)}
  .cv-title{position:absolute;z-index:2;right:7%;top:7%;writing-mode:vertical-rl;font-family:var(--mincho);font-weight:800;
    font-size:clamp(22px,6.6vw,30px);letter-spacing:.18em;color:#fbf6ec;text-shadow:0 2px 10px rgba(10,20,30,.8)}
  .cv-title small{display:block;font-size:.55em;letter-spacing:.1em;margin-right:.3em;opacity:.95}
  .cv-author{position:absolute;z-index:2;left:12%;bottom:5%;font-family:var(--mincho);font-weight:700;font-size:13px;letter-spacing:.2em;color:#fbf6ec;text-shadow:0 1px 6px rgba(0,0,0,.9)}
  .bv-info{text-align:center;margin-top:16px}
  .bv-info .vol{font-size:12px;letter-spacing:.25em;color:var(--accent2);font-weight:700}
  .bv-info h2{font-family:var(--mincho);font-weight:800;font-size:clamp(23px,6vw,30px);letter-spacing:.08em;margin:4px 0 2px;line-height:1.35}
  .bv-info .meta{font-size:13px;color:var(--cream2)}
  .bv-desc{margin:14px 0 0;font-size:15px;line-height:1.85;color:var(--cream)}
  .btn-main{display:block;width:100%;margin:18px 0 0;background:var(--accent);color:#2a1a08;border:0;border-radius:28px;padding:15px 20px;font-size:17px;font-weight:700;letter-spacing:.08em;
    box-shadow:0 6px 16px -6px rgba(226,166,90,.7)}
  .btn-main:hover{background:var(--accent2)}
  .hint{font-size:12.5px;color:var(--cream2);text-align:center;margin:8px 0 0;line-height:1.7}
  .contents{margin:22px 0 0;padding:14px 16px 8px;border-radius:6px;
    background:linear-gradient(180deg,#f6eedc,#efe4cc);color:#2c241c;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12), 0 8px 20px rgba(0,0,0,.4)}
  .contents h3{margin:0 0 6px;font-family:var(--mincho);font-size:15px;letter-spacing:.3em;text-align:center;color:#6b4a26}
  .contents ol{list-style:none;margin:0;padding:0}
  .contents li+li{border-top:1px dashed rgba(60,40,20,.25)}
  .contents button{width:100%;display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 2px;background:none;border:0;text-align:left;color:inherit;font-family:var(--mincho);font-size:17px;font-weight:700}
  .contents .n{flex:none;min-width:4em;font-family:var(--gothic);font-size:12.5px;color:#7a5a36;font-weight:500}
  .contents .go{margin-left:auto;color:#a06a2c;font-size:18px}

  /* ===== 読む・聞く（朗読帖のページ） ===== */
  .rd{position:fixed;inset:0;z-index:40;background:#f6eedc;display:flex;flex-direction:column;animation:openbook .45s ease both}
  @keyframes openbook{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .rd-bar{flex:none;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:#2b231e;border-bottom:1px solid rgba(0,0,0,.4)}
  .rd-bar b{flex:1;min-width:0;text-align:center;font-family:var(--mincho);font-size:16px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rd-bar a,.rd-bar button{flex:none;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:14px;color:var(--cream);text-decoration:none}
  .rd-body{position:relative;flex:1}
  .rd-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .rd-wait{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#5b4a38;font-family:var(--mincho);font-size:16px;text-align:center;padding:24px;line-height:1.8}
  .rd-wait a{color:#24476b;font-family:var(--gothic);font-weight:700}
  @media (prefers-reduced-motion:reduce){.tome,.rd,.bv{animation:none}.spine{transition:none}}
</style>
</head>
<body>

<!-- 表紙の絵（背表紙と表紙で使う） -->
<svg class="sprite" aria-hidden="true">

    <defs>
      <linearGradient id="fu-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22385a"/><stop offset=".45" stop-color="#6f88a6"/><stop offset=".78" stop-color="#e9b98d"/><stop offset="1" stop-color="#f4d6ad"/></linearGradient>
      <linearGradient id="fu-mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e7d2" stop-opacity="0"/><stop offset=".5" stop-color="#f6e7d2" stop-opacity=".55"/><stop offset="1" stop-color="#f6e7d2" stop-opacity="0"/></linearGradient>
      <radialGradient id="fu-glow"><stop offset="0" stop-color="#ffe9b8" stop-opacity=".9"/><stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="400" height="480" fill="url(#fu-sky)"/>
    <g fill="#f7efe0"><circle cx="60" cy="52" r="1.2"/><circle cx="130" cy="30" r="1"/><circle cx="210" cy="62" r="1.3"/><circle cx="100" cy="96" r=".9"/><circle cx="250" cy="24" r="1"/></g>
    <circle cx="96" cy="128" r="40" fill="url(#fu-glow)"/>
    <circle cx="96" cy="128" r="17" fill="#fbefd2"/>
    <path d="M0 262 L48 214 L86 236 L140 182 L196 228 L238 200 L290 240 L340 196 L400 232 L400 300 L0 300Z" fill="#7b8ea3"/>
    <rect y="240" width="400" height="60" fill="url(#fu-mist)"/>
    <path d="M0 300 Q60 248 120 268 T236 258 Q300 236 400 270 L400 340 L0 340Z" fill="#4f6a5e"/>
    <g fill="none" stroke="#1f2a33" stroke-width="1.4" stroke-linecap="round"><path d="M250 150 q5 -5 10 0 q5 -5 10 0"/><path d="M278 168 q4 -4 8 0 q4 -4 8 0"/><path d="M232 176 q3 -3 6 0 q3 -3 6 0"/></g>
    <path d="M0 336 Q110 300 220 320 T400 316 L400 480 L0 480Z" fill="#34503f"/>
    <g fill="#c7a245"><path d="M168 330 Q260 312 400 326 L400 336 Q262 324 170 340Z"/><path d="M150 350 Q262 330 400 346 L400 357 Q262 343 154 361Z"/><path d="M140 372 Q262 352 400 368 L400 380 Q262 366 146 384Z"/><path d="M136 396 Q262 376 400 392 L400 405 Q262 391 142 409Z"/></g>
    <g fill="#e2c66e" opacity=".55"><path d="M200 334 Q290 322 400 330 L400 332 Q290 325 202 337Z"/><path d="M190 355 Q290 341 400 350 L400 352 Q290 344 192 358Z"/></g>
    <path d="M0 430 Q70 404 130 418 Q200 436 260 470 L250 480 L0 480Z" fill="#8fb0c2"/>
    <path d="M0 440 Q70 416 126 428" stroke="#c9dbe3" stroke-width="1.5" fill="none" opacity=".8"/>

function spineHtml(b, i) {
  const t = b.spine.length > 1 ? `${esc(b.spine[0])}<small>${esc(b.spine[1])}</small>` : esc(b.spine[0]);
  return `<button class="spine" data-book="${b.id}" style="--c:${b.c};--g:${b.g};--w:${b.w};--h:${b.h}" aria-label="第${KAN[i]}冊　${esc(b.title)}を取り出す">
    <span class="sp-band"></span>
    <span class="sp-title">${t}</span>
    <span class="sp-band b"></span>${b.vol ? `<span class="sp-no sp-vol">${esc(b.vol)}</span>` : ""}</button>`;
}
function renderShelf() {
  const w = window.innerWidth;
  const k = w >= 900 ? 1.45 : w >= 600 ? 1.25 : w > 420 ? 1 : .92;
  const inner = Math.min(w, 1000) - 20 - 2 * Math.min(22, Math.max(12, w * .028)) - 2 * Math.min(28, Math.max(8, w * .03));
  // 一段に並ぶ冊数を、棚の幅から決める
  const rows = [];
  let cur = [], used = 14 * k + 8;
  BOOKS.forEach((b, i) => {
    const need = (b.w + 3) * k;
    // 続きもの（全三巻など）は、なるべく同じ段にまとめて並べる
    let groupNeed = need;
    if (b.series && (i === 0 || BOOKS[i - 1].series !== b.series))
      groupNeed = BOOKS.filter(x => x.series === b.series).reduce((a, x) => a + (x.w + 3) * k, 0);
    if (cur.length && used + groupNeed > inner) { rows.push(cur); cur = []; used = 14 * k + 8; }
    cur.push(spineHtml(b, i)); used += need;
  });
  if (cur.length) rows.push(cur);
  const bay = (html, last) => `<div class="bay"><div class="row">${html}</div></div><div class="board${last ? " last" : ""}"></div>`;
  let html = rows.map((r, i) => bay(r.join("") + (i === rows.length - 1 ? `<span class="bookend"></span>` : ""), false)).join("");
  // いちばん下の段：横に積んだ本と花びん
  const stack = `<span class="lying">${[["#6b4a2e",92],["#2f4a3a",104],["#7a2f2a",98]].map(([c, ww]) => `<i style="--c:${c};width:${ww * k}px"></i>`).join("")}</span>`;
  html += bay(stack + DOLL + `<span class="soon">つぎの朗読帖は<br>ここに並びます</span>` + VASE, true);
  $("#shelf").innerHTML = html;
}
renderShelf();
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(renderShelf, 200); });

$("#toc").innerHTML = BOOKS.map((b, i) => `<li><button data-book="${b.id}"><span class="k">第${KAN[i]}冊</span><span class="dot" style="--c:${b.c}"></span><span>${esc(b.title)}</span><span class="arrow">›</span></button></li>`).join("");

/* ---------- 本を取り出す ---------- */
let busy = false;
function pullOut(id) {
  if (busy) return;
  const sp = document.querySelector(`.spine[data-book="${id}"]`);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!sp || reduce) { go("#b-" + id); return; }
  busy = true;
  sp.classList.add("pulling");
  setTimeout(() => { go("#b-" + id); busy = false; setTimeout(() => sp.classList.remove("pulling"), 400); }, 420);
}
document.addEventListener("click", e => {
  const s = e.target.closest(".spine,[data-book]");
  if (s && !e.target.closest("#bookView")) {
    const id = s.getAttribute("data-book");
    if (s.classList.contains("spine")) pullOut(id);
    else { const sp = document.querySelector(`.spine[data-book="${id}"]`); if (sp) sp.scrollIntoView({ block: "center", behavior: "smooth" }); setTimeout(() => pullOut(id), 350); }
  }
});

function go(h) { if (location.hash !== h) location.hash = h; else route(); }
function back() {
  if (history.length > 1 && entered) history.back();
  else { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { location.hash = ""; } route(); }
}
let entered = false;
/* 本を閉じて、本棚にもどす */
function toShelf() {
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { location.hash = ""; }
  route();
}
window.__closeReader = toShelf;
try {
  if (window.parent !== window && window.parent.__closeReader &&
      window.parent.location.pathname.replace(/index\.html$/, "") === location.pathname.replace(/index\.html$/, "")) {
    window.parent.__closeReader();
  }
} catch (e) {}

const RB = new Set(["roudoku","rekishi","hitobito","tane","kotoba","tani1","tani2","tani3","wari","manabi"]);  // 右綴じにする本（いまは全冊）
function showBook(b) {
  const i = BOOKS.indexOf(b);
  const t = b.spine.length > 1 ? `${esc(b.spine[0])}<small>${esc(b.spine[1])}</small>` : esc(b.title);
  $("#bvBg").innerHTML = art(b.id);
  $("#bvBg").style.cssText = "filter:blur(28px) brightness(.5);transform:scale(1.2)";
  $("#bvInner").innerHTML = `
    <div class="bv-head"><button class="btn-ghost" data-act="back">‹ 本棚にもどす</button></div>
    <div class="stage"><div class="tome${b.img || b.imgUrl ? " tall" : ""}${RB.has(b.id) ? " rb" : ""}" data-bk="${b.id}" style="--c:${b.c}">
      <div class="cover">${b.imgUrl ? imgArt(b) : b.img ? `<svg viewBox="60 0 1080 1920" preserveAspectRatio="xMidYMin slice" aria-hidden="true"><defs><clipPath id="spR"><rect x="1080" y="0" width="60" height="1920"/></clipPath></defs><use href="#cv-${b.id}"/><g clip-path="url(#spR)"><use href="#cv-${b.id}" transform="translate(1080 0) scale(60 1) translate(-1079 0)"/></g></svg>` : art(b.id)}${b.img || b.imgUrl ? "" : `<div class="cv-title">${t}</div>`}${b.imgUrl ? "" : `<div class="cv-author">作　中島義健</div>`}</div>
    </div></div>
    <div class="bv-info">
      <div class="vol">朗読帖　第${KAN[i]}冊</div>
      <h2>${esc(b.title)}</h2>
      <div class="meta">${esc(b.meta)}</div>
    </div>
    <p class="bv-desc">${esc(b.desc)}</p>
    <button class="btn-main" data-act="read">本をひらいて　読む・聞く</button>
    <p class="hint">${b.hint ? esc(b.hint) : b.noIntro ? "ひらくと、この巻の朗読を聞けます。" : `「${esc(b.intro || "はじめに")}」から再生すると、${b.series ? "この巻の最後の話まで" : "最後の話まで"}続けて聞けます。`}</p>
    <div class="contents"><h3>目　次</h3><ol>
      ${b.noIntro ? "" : `<li><button data-act="read"><span class="n">序</span>${esc(b.intro || "はじめに")}<span class="go">›</span></button></li>`}
      ${b.stories.map(([n, s]) => `<li><button data-act="read"><span class="n">${esc(n)}</span>${esc(s)}<span class="go">›</span></button></li>`).join("")}
    </ol></div>`;
  $("#bookView").classList.remove("hidden");
  $("#bvScroll").scrollTop = 0;
  document.body.style.overflow = "hidden";
}
$("#bvInner").addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const id = (location.hash.match(/^#b-(.+)$/) || [])[1];
  if (a.dataset.act === "back") back();
  else if (a.dataset.act === "read" && id) { entered = true; location.hash = "#r-" + id; }
});

/* ---------- 読む・聞く ---------- */
let waitTimer;
function showReader(b) {
  const u = urlOf(b);
  $("#rdTitle").textContent = b.title;
  $("#rdOut").href = u; $("#rdWaitLink").href = u;
  const f = $("#rdFrame");
  $("#rdWait").style.display = ""; $("#rdWaitMsg").textContent = "本をひらいています…";
  if (f.getAttribute("src") !== u) { f.style.opacity = 0; f.src = u; }
  f.onload = () => {
    if (!f.getAttribute("src") || f.getAttribute("src") === "about:blank") return;
    let ok = false;
    try { const d = f.contentDocument; ok = !!(d && d.body && d.body.childElementCount); } catch (e) {}
    if (!ok) {  // この画面の中では朗読帖をひらけない（Claudeの画面で見ているときなど）
      f.style.opacity = 0;
      $("#rdWaitMsg").innerHTML = "この画面の中では、本をひらくことができません。<br>GitHubで公開した本棚では、ここに本文が出ます。";
      $("#rdWait").style.display = "";
      return;
    }
    f.style.opacity = 1; $("#rdWait").style.display = "none";
    fixBackLinks(f);
    setTimeout(() => fixBackLinks(f), 600);
  };
  $("#reader").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
/* 朗読帖のページにある「朗読帖の本棚にもどる」を「本棚にもどす」にして、
   押したら本の中に本棚を開かず、この本棚の画面にもどる */
const samePage = u => u.origin === location.origin &&
  u.pathname.replace(/index\.html$/, "") === location.pathname.replace(/index\.html$/, "");
function isShelfUrl(u) { return samePage(u) || /\/roudoku_hondana(\/|$)/.test(u.pathname); }
function fixBackLinks(f) {
  let w, d;
  try { w = f.contentWindow; d = f.contentDocument; if (!d || !w.location.href.startsWith("http")) return; } catch (e) { return; }
  try {
    if (isShelfUrl(new URL(w.location.href))) { toShelf(); return; }  // 本の中に本棚が開いてしまったとき
    d.querySelectorAll("a[href]").forEach(a => {
      if (a.dataset.shelfFixed) return;
      let u; try { u = new URL(a.getAttribute("href"), w.location.href); } catch (e) { return; }
      if (!isShelfUrl(u)) return;
      a.dataset.shelfFixed = "1";
      a.textContent = "‹ 本棚にもどす";
      a.removeAttribute("target");
      a.addEventListener("click", e => { e.preventDefault(); toShelf(); });
    });
  } catch (e) {}
}
function hideReader() {
  const f = $("#rdFrame");
  if (f.getAttribute("src") && f.getAttribute("src") !== "about:blank") f.src = "about:blank"; // 朗読を止める
  $("#reader").classList.add("hidden");
}
$("#rdClose").addEventListener("click", back);

/* ---------- 画面の切りかえ（スマホの「戻る」でも閉じられます） ---------- */
function route() {
  const h = location.hash;
  let m;
  if ((m = h.match(/^#r-(.+)$/)) && getBook(m[1])) {
    const b = getBook(m[1]);
    if ($("#bookView").classList.contains("hidden")) showBook(b);
    showReader(b);
  } else if ((m = h.match(/^#b-(.+)$/)) && getBook(m[1])) {
    hideReader();
    const b = getBook(m[1]);
    if ($("#bookView").classList.contains("hidden") || !$("#bvInner").innerHTML.includes(`data-bk="${b.id}"`)) showBook(b);
    entered = true;
  } else {
    hideReader();
    $("#bookView").classList.add("hidden");
    document.body.style.overflow = "";
  }
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => { if (e.key === "Escape" && location.hash) back(); });
route();
})();
</script>
</body>
